name: ci

on:
  push:
  pull_request:

jobs:
  clone-and-install:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/vscode/devcontainers/base:ubuntu
      env:
        CODESPACES: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./install.sh
      - name: chezmoi data
        run: '"$HOME/.local/bin/chezmoi" data'
      - name: Check managed files
        run: |
          test -f "$HOME/.takt/runtime.yaml"
          node -e 'const s = require(process.env.HOME + "/.pi/agent/settings.json"); if (!s.packages.includes("npm:@amaster.ai/pi-browser-use")) process.exit(1)'
          test ! -e "$HOME/README.md"
          test ! -e "$HOME/scripts/install-pi-packages.sh"
